<!doctype html>
<html><head><meta charset="utf-8"><title>bench-anim</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font:16px sans-serif;color:#fff}
  body{background:linear-gradient(120deg,#203a43,#2c5364,#0f2027);background-size:300% 300%;animation:bg 6s linear infinite}
  @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .box{position:absolute;width:12%;height:16%;border-radius:12px;animation:spin 3s linear infinite}
  @keyframes spin{from{transform:rotate(0deg) translateX(20px)}to{transform:rotate(360deg) translateX(20px)}}
  #t{position:absolute;left:8px;bottom:8px;font:bold 28px monospace}
</style></head>
<body>
<script>
  // Fixed layout (no randomness) so every run renders the same frames.
  const colors=['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e67e22'];
  for(let i=0;i<18;i++){const d=document.createElement('div');d.className='box';
    d.style.left=(5+(i%6)*15)+'%';d.style.top=(8+Math.floor(i/6)*28)+'%';
    d.style.background=colors[i%6];d.style.animationDuration=(2+(i%5)*0.5)+'s';document.body.appendChild(d);}
  const t=document.createElement('div');t.id='t';document.body.appendChild(t);
  let n=0;(function f(){t.textContent='frame '+(n++);requestAnimationFrame(f)})();
</script>
</body></html>
